linuxPasswordCollection:
  get:
    tags: [Workspace LinuxPasswords]
    summary: List linux password servers
    parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Fuzzy match on hostname or ip
      - name: businessUnit
        in: query
        required: false
        schema:
          type: string
        description: Exact filter by business unit
    responses:
      '200':
        description: Linux password server list
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/schemas/LinuxPasswordServer'
                businessUnits:
                  type: array
                  items:
                    type: string
      '401':
        description: Unauthorized
  post:
    tags: [Workspace LinuxPasswords]
    summary: Create linux password server
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/schemas/LinuxPasswordUpsertRequest'
    responses:
      '200':
        description: Created server
        content:
          application/json:
            schema:
              $ref: '#/schemas/LinuxPasswordServer'
      '400':
        $ref: ../../components/common.yaml#/responses/BadRequest
      '401':
        description: Unauthorized

linuxPasswordItem:
  get:
    tags: [Workspace LinuxPasswords]
    summary: Get linux password server by id
    parameters:
      - $ref: ../../components/common.yaml#/parameters/EntityIdParam
    responses:
      '200':
        description: Server detail
        content:
          application/json:
            schema:
              $ref: '#/schemas/LinuxPasswordServer'
      '401':
        description: Unauthorized
      '404':
        $ref: ../../components/common.yaml#/responses/NotFound
  put:
    tags: [Workspace LinuxPasswords]
    summary: Update linux password server (admin only)
    parameters:
      - $ref: ../../components/common.yaml#/parameters/EntityIdParam
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/schemas/LinuxPasswordUpsertRequest'
    responses:
      '200':
        description: Updated server
        content:
          application/json:
            schema:
              $ref: '#/schemas/LinuxPasswordServer'
      '400':
        $ref: ../../components/common.yaml#/responses/BadRequest
      '403':
        description: Forbidden – admin only
      '404':
        $ref: ../../components/common.yaml#/responses/NotFound
  delete:
    tags: [Workspace LinuxPasswords]
    summary: Delete linux password server (admin only)
    parameters:
      - $ref: ../../components/common.yaml#/parameters/EntityIdParam
    responses:
      '204':
        description: Deleted
      '403':
        description: Forbidden – admin only
      '404':
        $ref: ../../components/common.yaml#/responses/NotFound

linuxPasswordAccessAudits:
  get:
    tags: [Workspace LinuxPasswords]
    summary: List linux password access audit records (admin only)
    parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: staffId
        in: query
        required: false
        schema:
          type: string
      - name: staffName
        in: query
        required: false
        schema:
          type: string
      - name: hostname
        in: query
        required: false
        schema:
          type: string
      - name: ip
        in: query
        required: false
        schema:
          type: string
      - name: username
        in: query
        required: false
        schema:
          type: string
      - name: action
        in: query
        required: false
        schema:
          type: string
          enum: [VIEW, COPY]
      - name: result
        in: query
        required: false
        schema:
          type: string
          enum: [SUCCESS, FAILED]
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          default: 20
          maximum: 100
    responses:
      '200':
        description: Audit record list
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/schemas/LinuxPasswordAccessAudit'
                page:
                  type: integer
                pageSize:
                  type: integer
                total:
                  type: integer
                  format: int64
      '401':
        description: Unauthorized
      '403':
        description: Forbidden – admin only

linuxPasswordCredentialSecret:
  post:
    tags: [Workspace LinuxPasswords]
    summary: Reveal (decrypt) a linux credential password and write access audit
    parameters:
      - name: credentialId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [action]
            properties:
              action:
                type: string
                enum: [VIEW, COPY]
    responses:
      '200':
        description: Decrypted password
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
      '400':
        $ref: ../../components/common.yaml#/responses/BadRequest
      '401':
        description: Unauthorized
      '404':
        $ref: ../../components/common.yaml#/responses/NotFound

schemas:
  LinuxPasswordCredential:
    type: object
    properties:
      id:
        type: string
      username:
        type: string
      notes:
        type: string
      hasPassword:
        type: boolean

  LinuxPasswordServer:
    type: object
    properties:
      id:
        type: string
      hostname:
        type: string
      ip:
        type: string
      credentials:
        type: array
        items:
          $ref: '#/schemas/LinuxPasswordCredential'
      businessUnits:
        type: array
        items:
          type: string
      status:
        type: string
        enum: [online, maintenance, offline]

  LinuxPasswordUpsertRequest:
    type: object
    required: [hostname, ip, credentials]
    properties:
      hostname:
        type: string
      ip:
        type: string
      credentials:
        type: array
        items:
          type: object
          required: [username]
          properties:
            id:
              type: string
              description: Omit when creating a new credential
            username:
              type: string
            password:
              type: string
              description: Required when creating; omit or leave blank to keep existing password on update
            notes:
              type: string
      businessUnits:
        type: array
        items:
          type: string
      status:
        type: string
        enum: [online, maintenance, offline]
        description: Ignored on create (server defaults to online); required on update

  LinuxPasswordAccessAudit:
    type: object
    properties:
      id:
        type: string
      accountId:
        type: string
      staffRecordId:
        type: string
      staffId:
        type: string
      staffName:
        type: string
      serverId:
        type: string
      hostname:
        type: string
      ip:
        type: string
      credentialId:
        type: string
      username:
        type: string
      action:
        type: string
        enum: [VIEW, COPY]
      result:
        type: string
        enum: [SUCCESS, FAILED]
      clientIp:
        type: string
      userAgent:
        type: string
      createTime:
        type: string
        format: date-time
