openapi: 3.0.3
info:
  title: Support Roster API
  description: Support roster public viewer APIs and workspace admin APIs
  version: 2.0.0

servers:
  - url: http://localhost:8080/api
    description: Local development server

tags:
  - name: Viewer Teams
  - name: Viewer Shifts
  - name: Viewer Staff
  - name: Viewer RoleGroups
  - name: Viewer ShiftCodes
  - name: Workspace Overview
  - name: Workspace Staff
  - name: Workspace ShiftDefinitions
  - name: Workspace Teams
  - name: Workspace RoleGroups
  - name: Workspace Roster
  - name: Workspace Validation
  - name: Workspace ImportExport
  - name: Workspace LinuxPasswords

paths:
  /teams:
    $ref: ./paths/viewer/teams.yaml#/teamCollection
  /shifts:
    $ref: ./paths/viewer/shifts.yaml#/shiftCollection
  /shifts/{id}:
    $ref: ./paths/viewer/shifts.yaml#/shiftItem
  /staff:
    $ref: ./paths/viewer/staff.yaml#/staffCollection
  /staff/{id}:
    $ref: ./paths/viewer/staff.yaml#/staffItem
  /role-groups:
    $ref: ./paths/viewer/role-groups.yaml#/roleGroupCollection
  /shift-codes:
    $ref: ./paths/viewer/shift-codes.yaml#/shiftCodeCollection
  /workspace/overview:
    $ref: ./paths/workspace/overview.yaml#/overview
  /workspace/role-groups:
    $ref: ./paths/workspace/role-groups.yaml#/roleGroupCollection
  /workspace/staff:
    $ref: ./paths/workspace/staff.yaml#/staffCollection
  /workspace/staff/batch:
    $ref: ./paths/workspace/staff.yaml#/staffBatchCreate
  /workspace/staff/{id}:
    $ref: ./paths/workspace/staff.yaml#/staffItem
  /workspace/shift-definitions:
    $ref: ./paths/workspace/shift-definitions.yaml#/shiftDefinitionCollection
  /workspace/shift-definitions/reorder:
    $ref: ./paths/workspace/shift-definitions.yaml#/shiftDefinitionReorder
  /workspace/shift-definitions/{id}:
    $ref: ./paths/workspace/shift-definitions.yaml#/shiftDefinitionItem
  /workspace/teams:
    $ref: ./paths/workspace/teams.yaml#/teamCollection
  /workspace/teams/{id}:
    $ref: ./paths/workspace/teams.yaml#/teamItem
  /workspace/roster:
    $ref: ./paths/workspace/roster.yaml#/roster
  /workspace/roster/save:
    $ref: ./paths/workspace/roster.yaml#/rosterSave
  /workspace/validation:
    $ref: ./paths/workspace/validation.yaml#/validation
  /workspace/validation/resolve:
    $ref: ./paths/workspace/validation.yaml#/resolve
  /workspace/validation/{id}/preview-remediation:
    $ref: ./paths/workspace/validation.yaml#/preview-remediation
  /workspace/validation/{id}/apply-remediation:
    $ref: ./paths/workspace/validation.yaml#/apply-remediation
  /workspace/import-export/preview:
    $ref: ./paths/workspace/import-export.yaml#/preview
  /workspace/import-export/save:
    $ref: ./paths/workspace/import-export.yaml#/save
  /workspace/import-export/export:
    $ref: ./paths/workspace/import-export.yaml#/export
  /workspace/linux-passwords:
    $ref: ./paths/workspace/linux-passwords.yaml#/linuxPasswordCollection
  /workspace/linux-passwords/{id}:
    $ref: ./paths/workspace/linux-passwords.yaml#/linuxPasswordItem
  /workspace/linux-passwords/access-audits:
    $ref: ./paths/workspace/linux-passwords.yaml#/linuxPasswordAccessAudits
  /workspace/linux-passwords/credentials/{credentialId}/secret:
    $ref: ./paths/workspace/linux-passwords.yaml#/linuxPasswordCredentialSecret
  /workspace/linux-password-directories:
    $ref: ./paths/workspace/linux-password-directories.yaml#/linuxPasswordDirectories
