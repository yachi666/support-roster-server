parameters:
  DateParam:
    name: date
    in: query
    required: true
    schema:
      type: string
      format: date
  TeamIdParam:
    name: teamId
    in: query
    required: false
    schema:
      type: string
  TimezoneParam:
    name: timezone
    in: query
    required: false
    schema:
      type: string
      default: UTC
  StaffIdParam:
    name: id
    in: path
    required: true
    schema:
      type: integer
      format: int64
  ShiftIdParam:
    name: id
    in: path
    required: true
    schema:
      type: string
  EntityIdParam:
    name: id
    in: path
    required: true
    schema:
      type: integer
      format: int64
  YearParam:
    name: year
    in: query
    required: false
    schema:
      type: integer
      minimum: 2000
  MonthParam:
    name: month
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 12

responses:
  BadRequest:
    description: Bad request
    content:
      application/json:
        schema:
          $ref: '#/schemas/ErrorResponse'
  NotFound:
    description: Resource not found
    content:
      application/json:
        schema:
          $ref: '#/schemas/ErrorResponse'

schemas:
  Team:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      color:
        type: string
      order:
        type: integer
    required: [id, name, color, order]

  Contact:
    type: object
    properties:
      slack:
        type: string
      email:
        type: string
      phone:
        type: string

  Shift:
    type: object
    properties:
      id:
        type: string
      teamId:
        type: string
      staffId:
        type: integer
        format: int64
      userName:
        type: string
      userAvatar:
        type: string
      code:
        type: string
      meaning:
        type: string
      start:
        type: string
        format: date-time
      end:
        type: string
        format: date-time
      timezone:
        type: string
      isPrimary:
        type: boolean
      showOnRoster:
        type: boolean
      remark:
        type: string
      contact:
        $ref: '#/schemas/Contact'
    required: [id, teamId, staffId, userName, code, start, end, timezone]

  Staff:
    type: object
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
      avatar:
        type: string
      email:
        type: string
      phone:
        type: string
      slack:
        type: string
      region:
        type: string
      contact:
        type: string
      roleGroups:
        type: array
        items:
          type: string
    required: [id, name]

  RoleGroup:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      category:
        type: string
      region:
        type: string
    required: [id, name]

  ShiftCode:
    type: object
    properties:
      code:
        type: string
      meaning:
        type: string
      color:
        type: string
    required: [code, meaning]

  WorkspaceSummaryStat:
    type: object
    properties:
      label:
        type: string
      value:
        type: string
      trend:
        type: string
      status:
        type: string
      progress:
        type: integer

  WorkspaceActivity:
    type: object
    properties:
      user:
        type: string
      action:
        type: string
      time:
        type: string

  WorkspaceQuickAction:
    type: object
    properties:
      title:
        type: string
      subtitle:
        type: string
      variant:
        type: string
      actionKey:
        type: string

  WorkspaceOverviewResponse:
    type: object
    properties:
      stats:
        type: array
        items:
          $ref: '#/schemas/WorkspaceSummaryStat'
      activity:
        type: array
        items:
          $ref: '#/schemas/WorkspaceActivity'
      quickActions:
        type: array
        items:
          $ref: '#/schemas/WorkspaceQuickAction'

  WorkspaceRoleGroup:
    type: object
    properties:
      id:
        type: string
      code:
        type: string
      name:
        type: string
      category:
        type: string
      region:
        type: string
      description:
        type: string
      active:
        type: boolean

  WorkspaceTeam:
    type: object
    properties:
      id:
        type: string
      teamCode:
        type: string
      name:
        type: string
      color:
        type: string
      displayOrder:
        type: integer
      visible:
        type: boolean
      description:
        type: string
      roleGroups:
        type: array
        items:
          $ref: '#/schemas/WorkspaceRoleGroup'

  WorkspaceTeamUpsertRequest:
    type: object
    required: [teamCode, name, color, displayOrder, visible, roleGroupIds]
    properties:
      teamCode:
        type: string
      name:
        type: string
      color:
        type: string
      displayOrder:
        type: integer
      visible:
        type: boolean
      description:
        type: string
      roleGroupIds:
        type: array
        items:
          type: string

  WorkspaceStaff:
    type: object
    properties:
      id:
        type: string
      staffCode:
        type: string
      name:
        type: string
      email:
        type: string
      phone:
        type: string
      slack:
        type: string
      region:
        type: string
      timezone:
        type: string
      roleName:
        type: string
      teamName:
        type: string
      roleGroupId:
        type: string
      roleGroupCode:
        type: string
      roleGroupName:
        type: string
      status:
        type: string
      avatar:
        type: string
      notes:
        type: string
      rosterTags:
        type: array
        items:
          type: string

  WorkspaceStaffUpsertRequest:
    type: object
    required: [staffCode, name, roleGroupId]
    properties:
      staffCode:
        type: string
      name:
        type: string
      email:
        type: string
      phone:
        type: string
      slack:
        type: string
      region:
        type: string
      timezone:
        type: string
      roleName:
        type: string
      roleGroupId:
        type: string
      status:
        type: string
      avatar:
        type: string
      notes:
        type: string

  WorkspaceShiftDefinition:
    type: object
    properties:
      id:
        type: string
      teamId:
        type: string
      teamCode:
        type: string
      teamName:
        type: string
      code:
        type: string
      meaning:
        type: string
      startTime:
        type: string
        format: time
      endTime:
        type: string
        format: time
      timezone:
        type: string
      primaryShift:
        type: boolean
      visible:
        type: boolean
      colorHex:
        type: string
      remark:
        type: string
      teams:
        type: array
        items:
          $ref: '#/schemas/WorkspaceShiftDefinitionTeam'

  WorkspaceShiftDefinitionTeam:
    type: object
    properties:
      id:
        type: string
      teamCode:
        type: string
      name:
        type: string
      color:
        type: string

  WorkspaceShiftDefinitionUpsertRequest:
    type: object
    required: [teamIds, code, meaning, startTime, endTime, timezone, primaryShift, visible]
    properties:
      teamIds:
        type: array
        minItems: 1
        items:
          type: string
      code:
        type: string
      meaning:
        type: string
      startTime:
        type: string
        format: time
      endTime:
        type: string
        format: time
      timezone:
        type: string
      primaryShift:
        type: boolean
      visible:
        type: boolean
      colorHex:
        type: string
      remark:
        type: string

  WorkspaceRosterPerson:
    type: object
    properties:
      staffId:
        type: string
      staffName:
        type: string
      roleName:
        type: string
      roleGroupId:
        type: string
      schedule:
        type: object
        additionalProperties:
          type: string

  WorkspaceRosterGroup:
    type: object
    properties:
      teamId:
        type: string
      teamName:
        type: string
      color:
        type: string
      staff:
        type: array
        items:
          $ref: '#/schemas/WorkspaceRosterPerson'

  WorkspaceMonthlyRosterResponse:
    type: object
    properties:
      year:
        type: integer
      month:
        type: integer
      groups:
        type: array
        items:
          $ref: '#/schemas/WorkspaceRosterGroup'
      shiftCodeOptions:
        type: array
        items:
          type: string
      shiftCodeOptionsByTeam:
        type: object
        additionalProperties:
          type: array
          items:
            type: string
      shiftCodeColorMap:
        type: object
        additionalProperties:
          type: string
      shiftDetailsByTeam:
        type: object
        additionalProperties:
          type: object
          additionalProperties:
            $ref: '#/schemas/WorkspaceRosterShiftDetail'
      validationWarning:
        type: string

  WorkspaceRosterShiftDetail:
    type: object
    properties:
      code:
        type: string
      meaning:
        type: string
      startTime:
        type: string
        format: time
      endTime:
        type: string
        format: time
      timezone:
        type: string
      primaryShift:
        type: boolean
      colorHex:
        type: string
      overnight:
        type: boolean

  WorkspaceRosterCellUpdateRequest:
    type: object
    required: [staffId, day]
    properties:
      staffId:
        type: string
      day:
        type: integer
      shiftCode:
        type: string

  WorkspaceRosterSaveRequest:
    type: object
    required: [year, month, updates]
    properties:
      year:
        type: integer
      month:
        type: integer
      updates:
        type: array
        items:
          $ref: '#/schemas/WorkspaceRosterCellUpdateRequest'

  WorkspaceValidationIssue:
    type: object
    properties:
      id:
        type: string
      severity:
        type: string
      type:
        type: string
      description:
        type: string
      team:
        type: string
      date:
        type: string
      resolvable:
        type: boolean
      resolutionKind:
        type: string

  WorkspaceValidationSummary:
    type: object
    properties:
      high:
        type: integer
      medium:
        type: integer
      low:
        type: integer

  WorkspaceValidationResponse:
    type: object
    properties:
      summary:
        $ref: '#/schemas/WorkspaceValidationSummary'
      issues:
        type: array
        items:
          $ref: '#/schemas/WorkspaceValidationIssue'

  WorkspaceValidationResolveRequest:
    type: object
    required: [issueIds]
    properties:
      year:
        type: integer
      month:
        type: integer
      issueIds:
        type: array
        minItems: 1
        items:
          type: string

  WorkspaceValidationResolveResponse:
    type: object
    properties:
      resolvedCount:
        type: integer
      skippedCount:
        type: integer
      resolvedIssueIds:
        type: array
        items:
          type: string
      skippedIssueIds:
        type: array
        items:
          type: string
      validation:
        $ref: '#/schemas/WorkspaceValidationResponse'

  WorkspaceImportPreviewResponse:
    type: object
    properties:
      batchId:
        type: string
      year:
        type: integer
      month:
        type: integer
      status:
        type: string
      totalRecords:
        type: integer
      validRecords:
        type: integer
      invalidRecords:
        type: integer
      issues:
        type: array
        items:
          $ref: '#/schemas/WorkspaceValidationIssue'

  WorkspaceImportApplyResponse:
    type: object
    properties:
      batchId:
        type: string
      year:
        type: integer
      month:
        type: integer
      status:
        type: string
      appliedRecords:
        type: integer

  ErrorResponse:
    type: object
    properties:
      timestamp:
        type: string
        format: date-time
      status:
        type: integer
      error:
        type: string
      message:
        type: string
      path:
        type: string
    required: [timestamp, status, error, message, path]