spring:
  application:
    name: support-roster-server
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/support}
    username: ${DB_USERNAME:lzn}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

support:
  avatar:
    base-url: https://photos.global.image/casual/square
  auth:
    bootstrap-admin-staff-code: ${SUPPORT_BOOTSTRAP_ADMIN_STAFF_CODE:}
  logging:
    file:
      path: ${LOG_PATH:logs}

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY}
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
